name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the suite is pure local script execution -- it needs no write scope
# and no secrets, so a fork PR runs identically (AC-4).
permissions:
  contents: read

# Rapid successive pushes to the same ref cancel the older in-progress run (AC-9).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  suite:
    name: hook suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Job-level wall backstop (AC-7). Anchored on the worst-case per-JOB sum, not run-all.sh's
    # per-test 300s cap.
    #
    # 🔴 The anchor is a HOSTED reading, never a local one. The previous value was derived from an
    # "observed local MSYS run-all.sh wall ~5.6 min" and called the result "generous CI headroom";
    # the headroom it actually bought measured 32 SECONDS, and the next commit consumed it. A local
    # Git-Bash wall cannot anchor this: it is one machine, one shell, and the slowest lane is a
    # hosted windows-latest runner whose process spawn dominates the total.
    #
    # Derivation. Every figure here is a MEASURED hosted windows-latest wall, not a projection:
    #   19m28s (1168s)  @ 9d9e033 -- completed, reported 146/4
    #   20m17s (1217s)  @ aceede2 -- CANCELLED exactly at the old 20m wall, so it had NO total,
    #                   and the lane went unmeasured for two consecutive heads
    #   21m11s (1271s)  @ ce4abb7 -- COMPLETED under this budget, reported 150/0
    #   20m19s (1219s)  @ dd687cc -- COMPLETED, reported 150/0
    # ⇒ the lane needed 71 SECONDS more than the old constant allowed, and BOTH completed readings
    # are over the old 20m wall (by 71s and by 19s). "Generous CI headroom" was never generous: at
    # 9d9e033 it was 32s, and the next commit spent it.
    # ⇒ run-to-run spread on identical work is ~52s (1219..1271s), so a budget set near the wall is
    # a coin flip even when nothing changes. That spread is why the margin below is large.
    #
    # anchor     = 21m11s, the WORST measured wall (on ce4abb7) -- deliberately not the latest one.
    #              This list is the set of readings that existed when the line was written; the
    #              constant is NOT re-derived per commit, so a later head will have a reading that
    #              is not in it. Re-measure before changing the number, per the ratchet below.
    # projection = 29m27s, what this constant was originally set from, before any complete reading
    #              existed (1168s x 1.23 twice; +23% was the worst inter-round growth seen on the
    #              lanes that did complete). The measurement landed BELOW it, so the projection was
    #              conservative rather than wrong.
    # margin     = 45m - 21m11s = 23m49s (1429s), i.e. 112% of the measured wall.
    # Both numbers are kept on purpose: the margin is computed against the MEASUREMENT, and a reader
    # shown only one of them cannot tell which one it was computed against.
    #
    # 🔴 This is a ONE-WAY RATCHET: every gate added, and every fixture that stops no-op'ing, spends
    # some of that 1429s. That number is what the next reader watches being consumed -- re-measure
    # the windows lane and re-derive, rather than nudging the constant when it next goes red.
    timeout-minutes: 45
    strategy:
      # Don't cancel sibling OS legs when one fails -- a portability regression should show
      # WHICH platform broke, not mask the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # macOS only (AC-6). Prepend a shim so a bare `bash` resolves to stock /bin/bash 3.2.57
      # ahead of any Homebrew bash 5. run-all.sh invokes each test via bare `bash "$t"`, so
      # controlling PATH makes BOTH the aggregator AND every inner test interpreter 3.2 -- the
      # version proof below then binds to the interpreter that actually runs the tests, not a
      # top-level echo. Keyed on matrix.os (not the host-context alias) to keep the leak-scan clean.
      - name: Force stock bash 3.2 onto PATH (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p /tmp/aal-bash32
          ln -sf /bin/bash /tmp/aal-bash32/bash
          echo /tmp/aal-bash32 >> "$GITHUB_PATH"

      - name: Prove bash 3.2 at the test-execution layer (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "bash resolves to: $(command -v bash)"
          echo "outer shell \$BASH_VERSION=$BASH_VERSION"
          inner=$(bash -c 'printf %s "$BASH_VERSION"')
          echo "inner bare-bash \$BASH_VERSION=$inner  (== run-all.sh's 'bash \"\$t\"' resolution)"
          case "$inner" in
            3.2.*) echo "AC-6 OK: test-execution interpreter is bash $inner" ;;
            *) echo "AC-6 FAIL: expected bash 3.2.x, got '$inner'"; exit 1 ;;
          esac

      - name: Hook fixture suite (run-all.sh)
        run: bash hooks/tests/run-all.sh

      - name: Installer smoke (first-run-test.sh)
        run: bash bin/first-run-test.sh

      # The scanner adds the runtime OS user as a forbidden pattern to catch the AUTHOR's real name
      # leaking into a shipped file. It now SKIPS that augmentation in CI at the source (it reads the
      # CI env var — the `[ -z "${CI:-}" ]` guard in sanitize-check.sh, cited by CONTENT because a
      # line number goes stale silently), because the hosted OS login is a generic service account
      # (`runner` / `runneradmin`) that occurs benignly across the tree. So the real runner env flows
      # straight through here with NO masking — the source guard, not a workflow-layer blank, is what
      # keeps the generic login from false-positiving.
      #
      # What this step can and cannot certify. The forbidden-pattern set and the domain denylist are
      # LOADED from a wordlist outside the tree, and a hosted lane checks out no .claude/ — so this
      # run loads NO patterns and reports `PARTIAL PASS (<n> findings; 2 arms not configured)` BY DESIGN.
      # What it certifies is the wordlist-free arm: the CJK codepoint-range check, which is always
      # on. The pattern and denylist arms are certified only by a run whose report header names a
      # resolved wordlist — read that header before treating a report as covering them.
      - name: Leak scanner (sanitize-check.sh)
        run: bash bin/sanitize-check.sh

  lint:
    name: shell + workflow lint
    runs-on: ubuntu-latest
    # Static-analysis lane (R-shellcheck-gate). Runs in PARALLEL to the behavioral `suite`
    # matrix (no `needs:`), so it never blocks/delays the suite and vice-versa. ubuntu-latest
    # ships shellcheck preinstalled -- no install step for it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # shellcheck (preinstalled on ubuntu runners). --shell=bash: every tracked .sh is
      # #!/usr/bin/env bash, so bash-only constructs ([[ ]], arrays) must NOT flag as POSIX
      # violations (AC-4). Policy (armed correctness codes / disabled noise) lives in the
      # repo-root .shellcheckrc, which shellcheck reads automatically when run from the root.
      # -z / -0: NUL-delimited file list, robust to any path.
      - name: shellcheck (all tracked .sh, --shell=bash)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --shell=bash

      # actionlint: validate the workflow YAML (runner labels, expressions, action refs, syntax).
      # Pinned version + published SHA256, verified fail-CLOSED before the binary runs (rule #8
      # supply-chain). -shellcheck= DISABLES actionlint's embedded shellcheck-of-run-blocks: the
      # standalone shellcheck step above owns shell linting under our single .shellcheckrc policy;
      # actionlint owns workflow-structure validation only (no double-lint / policy divergence).
      - name: actionlint (pinned + checksum, fail-closed)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl -fsSL -o "$tarball" "$url"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color -shellcheck=
